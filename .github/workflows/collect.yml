name: Collect bars

# 22:30 UTC on weekdays is after the 17:00 ET close in both EST and EDT.
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch into data_store/
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth 1 origin data
            git worktree add data_store origin/data
            git -C data_store switch -c data
          else
            git worktree add --orphan -b data data_store
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m venv .venv && .venv/bin/pip install -e .

      - run: .venv/bin/python -m apollo.data.collect --root data_store

      - name: Refresh market context from OpenBB (VIX, VXN, economic calendar)
        run: .venv/bin/python -m apollo.context.collect --root data_store

      - name: Score finished sessions in the ledger
        run: |
          for s in MNQ MES M2K MYM; do
            .venv/bin/python -m apollo.models.report --root data_store --symbol "$s" \
              --score-ledger || echo "::warning::scoring failed for $s"
          done

      - name: Commit and push new bars
        working-directory: data_store
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No new bars."
          else
            git commit -m "data: $(date -u +%F)"
            git push origin data
          fi
